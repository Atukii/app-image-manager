<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="AiM logo: a smiling lavender app box with a pink update badge">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <g transform="translate(-9 0)">
  <!-- soft shadow -->
  <ellipse cx="128" cy="226" rx="74" ry="10" fill="#0F081D" opacity="0.18"/>
  <!-- box body -->
  <rect x="44" y="70" width="168" height="150" rx="44" fill="url(#body)"/>
  <!-- lid -->
  <rect x="34" y="52" width="188" height="56" rx="26" fill="url(#lid)"/>
  <!-- tape on the lid -->
  <rect x="112" y="52" width="32" height="56" rx="6" fill="#C4B5FD" opacity="0.55"/>
  <!-- face -->
  <ellipse cx="98" cy="150" rx="11" ry="14" fill="#0F081D"/>
  <ellipse cx="158" cy="150" rx="11" ry="14" fill="#0F081D"/>
  <circle cx="102" cy="144" r="4" fill="#FFFFFF"/>
  <circle cx="162" cy="144" r="4" fill="#FFFFFF"/>
  <ellipse cx="78" cy="176" rx="14" ry="8" fill="#F4A79A" opacity="0.85"/>
  <ellipse cx="178" cy="176" rx="14" ry="8" fill="#F4A79A" opacity="0.85"/>
  <path d="M112 178 Q128 194 144 178" fill="none" stroke="#0F081D" stroke-width="7" stroke-linecap="round"/>
  <!-- update badge -->
  <circle cx="206" cy="58" r="34" fill="#F4A79A" stroke="#FFFFFF" stroke-width="6"/>
  <path d="M206 40 V74 M192 62 L206 76 L220 62" fill="none" stroke="#0F081D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
